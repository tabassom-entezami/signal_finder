[project]
name = "signal-engine"
version = "0.1.0"
description = "Crypto signal engine: deterministic quant signals with a hash-committed public record"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.6",
    "pyarrow>=18",
    "duckdb>=1.1",
    "ccxt>=4.5.88",
    "numpy>=2.5.4",
    "purgedcv==0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.170.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["docs", "tasks", "data"]  # documents, plans and data are not product code
# The .gitignore is the public allow-list, so honouring it would skip every private module and test.
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "ccxt", "ccxt.*", "pandas", "pandas.*"]
ignore_missing_imports = true
